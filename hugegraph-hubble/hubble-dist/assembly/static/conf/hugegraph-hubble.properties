server.host=localhost
server.port=8088

gremlin.suffix_limit=250
gremlin.vertex_degree_limit=100
gremlin.edges_total_limit=500
gremlin.batch_query_ids=100

cluster=hg
idc=bddwd
client.url_cache_max_entries=1024

# ===== Deployment Mode =====
# Set to false for standalone RocksDB mode (no PD dependency)
pd.enabled=false
# Direct server URL, only used when pd.enabled=false
server.direct_url=http://127.0.0.1:8080

# pd
pd.peers=127.0.0.1:8686
pd.server=127.0.0.1:8620

# Native operations aggregation. Supply PD/Store passwords through a protected
# deployment configuration. PD/Store 1.7 additionally require management
# network isolation because legacy authentication is not a strong boundary.
operations.connect_timeout_ms=1500
operations.read_timeout_ms=2500
operations.max_response_bytes=1048576
operations.cache_ttl_seconds=5
operations.cache_max_entries=1024
operations.store_threads=16
operations.store_deadline_ms=5000
# Operator-managed exact Store metric origins. Local-test defaults only;
# production must list every trusted Store scheme, host, and port.
operations.store.allowed_targets=[http://127.0.0.1:8520,http://[::1]:8520]
operations.pd.username=hubble
operations.pd.password=
operations.store.username=hubble
operations.store.password=

# dashboard
dashboard.address=127.0.0.1:8092
# BOTH, NODE_PORT, DDS
route.type=NODE_PORT

# Set monitor url
monitor.url=
prometheus.url=http://127.0.0.1:8090

# ES
es.urls=


# Shared Text2GQL fallback. Managed model settings override all these values, even when disabled.
text2gql.shared.enabled=false
text2gql.shared.connection_type=openai
text2gql.shared.base_url=
text2gql.shared.model=
# Read the API key from HUBBLE_TEXT2GQL_API_KEY or this secret file; never store it in this file.
text2gql.shared.api_key_file=
# Base64 AES-256 key. Generated with owner-only access on first managed secret save.
# HUBBLE_TEXT2GQL_MASTER_KEY may supply the same Base64 key through a secret manager.
text2gql.shared.master_key_file=data/text2gql-master.key
