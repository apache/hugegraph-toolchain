info.app.name=hugegraph-hubble
info.app.version=v1.2
spring.profiles.active=dev

# SECURITY: Production or public deployments must terminate HTTPS before Hubble.
# Never expose Hubble's plain HTTP listener directly to an untrusted network.
# Trust forwarding headers only from Tomcat's internal-proxy ranges. Configure
# server.tomcat.remoteip.internal-proxies explicitly when the HTTPS proxy uses other ranges.
server.forward-headers-strategy=native
# Keep an active browser session alive; Servlet access refreshes the idle timer.
server.servlet.session.timeout=48h

# Login brute-force protection: first three failures pass normally, then back off.
auth.login.failure-threshold=4
auth.login.initial-backoff-seconds=5
auth.login.max-backoff-seconds=600
auth.login.max-tracked-principals=10000

# Static resources and H2 metadata (use a new database for Hubble 1.8)
spring.web.resources.static-locations=classpath:/ui/
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/hubble-v2;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.data-locations=classpath:database/data.sql

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=hugegraph-hubble-HikariCP
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.messages.encoding=UTF-8
spring.messages.basename=i18n/messages
spring.messages.fallback-to-system-locale=false

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

spring.main.allow-bean-definition-overriding=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
spring.servlet.multipart.resolve-lazily=false

mybatis-plus.global-config.banner=false
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=org.apache.hugegraph.entity
mybatis-plus.configuration.cache-enabled=false
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.use-generated-keys=true
mybatis-plus.configuration.default-executor-type=reuse
mybatis-plus.configuration.default-statement-timeout=600

management.endpoints.web.exposure.include=*

# close es health check
management.health.elasticsearch.enabled=false

logging.level.org.springframework=WARN
logging.level.org.apache.hugegraph.mapper=INFO
logging.level.org.apache.hugegraph.service=INFO
logging.file.name=logs/hugegraph-hubble.log
#logging.config=file:./conf/log4j2.xml
logging.logback.rollingpolicy.max-file-size=10MB

# ESService creates the configured ES 7 client lazily; do not create a default ES 8 client.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
