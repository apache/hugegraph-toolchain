server.servlet.context-path=/api/v1.1
server.port=8088

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:db
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.data-locations=classpath:database/data.sql

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HugeGraphHubbleHikariCP
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.messages.encoding=UTF-8
spring.messages.basename=i18n/messages
spring.messages.fallback-to-system-locale=false

mybatis-plus.type-aliases-package=org.apache.hugegraph.entity
mybatis-plus.configuration.cache-enabled=false
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.use-generated-keys=true
mybatis-plus.configuration.default-executor-type=reuse
mybatis-plus.configuration.default-statement-timeout=600

logging.level.org.springframework=WARN
logging.level.org.apache.hugegraph.mapper=DEBUG
logging.level.org.apache.hugegraph.service=INFO
logging.file.name=logs/hugegraph-hubble.log
logging.logback.rollingpolicy.max-file-size=10MB

# ESService creates the configured ES 7 client lazily; do not create a default ES 8 client.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
