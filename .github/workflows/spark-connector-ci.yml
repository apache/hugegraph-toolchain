name: "spark-connector-ci"

on:
  workflow_call:
    inputs:
      server-repository:
        type: string
        default: apache/hugegraph
      artifact-name:
        type: string
        required: true
      server-commit:
        type: string
        required: true
      server-ref:
        type: string
        required: true

jobs:
  spark-connector-ci:
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-spark-connector/assembly/travis
    strategy:
      fail-fast: false
      matrix:
        JAVA_VERSION: [ '11', '17' ]

    steps:
      - name: Fetch Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The published HugeGraph 1.7 authentication fixture requires Java 11.
      - name: Setup server Java
        id: server-java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Save server Java path
        id: server-path
        run: echo "path=$JAVA_HOME/bin:$PATH" >> "$GITHUB_OUTPUT"

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'temurin'
          use-stage: ${{ env.USE_STAGE }}

      - name: Compile
        run: |
          mvn install -pl hugegraph-client,hugegraph-spark-connector -am -Dmaven.javadoc.skip=true -DskipTests -ntp

      - name: Setup HugeGraph server
        uses: ./.github/actions/setup-hugegraph-server
        env:
          JAVA_HOME: ${{ steps.server-java.outputs.path }}
          PATH: ${{ steps.server-path.outputs.path }}
        with:
          travis-dir: ${{ env.TRAVIS_DIR }}
          commit-id: ${{ inputs.server-commit }}
          repository: ${{ inputs.server-repository }}
          fetch-ref: ${{ inputs.server-ref }}
          artifact-name: ${{ inputs.artifact-name }}
          mode: start

      - name: Run test
        run: |
          cd hugegraph-spark-connector && ls
          mvn test
