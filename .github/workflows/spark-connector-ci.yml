name: "spark-connector-ci"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - /^release-.*$/
    paths:
      - hugegraph-spark-connector/**
      - hugegraph-dist/**
      - .github/workflows/**
      - pom.xml
  pull_request:
    paths:
      - hugegraph-spark-connector/**
      - hugegraph-dist/**
      - hugegraph-client/**
      - .github/workflows/**
      - pom.xml

jobs:
  spark-connector-ci:
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-spark-connector/assembly/travis
    strategy:
      matrix:
        JAVA_VERSION: [ '11' ]

    steps:
      - name: Fetch Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get HugeGraph stable commit id
        id: get-commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'apache';
            const repo = 'hugegraph';
            const { data: release } = await github.rest.repos.getLatestRelease({ owner, repo });
            const { data: ref } = await github.rest.git.getRef({
              owner, repo, ref: `tags/${release.tag_name}`
            });
            let sha = ref.object.sha;
            if (ref.object.type === 'tag') {
              const { data: tag } = await github.rest.git.getTag({ owner, repo, tag_sha: sha });
              sha = tag.object.sha;
            }
            sha = sha.substring(0, 7);
            core.exportVariable('COMMIT_ID', sha);
            core.setOutput('commit_id', sha);
            console.log(`Using HugeGraph release ${release.tag_name} (${sha})`);

      - name: Install JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: use staged maven repo settings
        if: ${{ env.USE_STAGE == 'true' }}
        run: |
          cp $HOME/.m2/settings.xml /tmp/settings.xml
          mv -vf .github/configs/settings.xml $HOME/.m2/settings.xml

      - name: Compile
        run: |
          mvn install -pl hugegraph-client,hugegraph-spark-connector -am -Dmaven.javadoc.skip=true -DskipTests -ntp

      - name: Prepare env and service
        run: |
          $TRAVIS_DIR/install-hugegraph-from-source.sh $COMMIT_ID

      - name: Run test
        run: |
          cd hugegraph-spark-connector && ls
          mvn test
