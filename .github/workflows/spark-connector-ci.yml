name: "spark-connector-ci"

on:
  workflow_call:
    inputs:
      server-repository:
        type: string
        default: apache/hugegraph
      artifact-name:
        type: string
        required: true
      server-commit:
        type: string
        required: true
      server-ref:
        type: string
        required: true

jobs:
  spark-connector-ci:
    runs-on: ubuntu-latest
    env:
      TRAVIS_DIR: hugegraph-spark-connector/assembly/travis
    strategy:
      matrix:
        JAVA_VERSION: ['17']

    steps:
      - name: Fetch Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install released Server JVM
        id: released-java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          overwrite-settings: false

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install locked candidate SDK
        id: candidate-sdk
        uses: ./.github/actions/setup-candidate-sdk

      - name: Compile
        run: |
          mvn install -pl hugegraph-client,hugegraph-spark-connector -am -Dmaven.javadoc.skip=true -DskipTests -ntp

      - name: Setup HugeGraph server
        uses: ./.github/actions/setup-hugegraph-server
        with:
          travis-dir: ${{ env.TRAVIS_DIR }}
          commit-id: ${{ inputs.server-commit }}
          repository: ${{ inputs.server-repository }}
          fetch-ref: ${{ inputs.server-ref }}
          java-home: ${{ steps.released-java.outputs.path }}
          mode: start
          artifact-name: ${{ inputs.artifact-name }}
          java-version: '11'

      - name: Run test
        run: |
          cd hugegraph-spark-connector && ls
          mvn test
