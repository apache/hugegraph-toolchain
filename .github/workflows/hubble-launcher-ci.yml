name: Hubble launcher tests

on:
  push:
    branches:
      - master
      - 'release-*'
    paths:
      - hugegraph-hubble/hubble-dist/assembly/static/bin/start-hubble.sh
      - hugegraph-hubble/hubble-dist/assembly/static/bin/stop-hubble.sh
      - hugegraph-hubble/hubble-dist/assembly/travis/test_hubble_launchers.py
      - .github/workflows/hubble-launcher-ci.yml
  pull_request:
    paths:
      - hugegraph-hubble/hubble-dist/assembly/static/bin/start-hubble.sh
      - hugegraph-hubble/hubble-dist/assembly/static/bin/stop-hubble.sh
      - hugegraph-hubble/hubble-dist/assembly/travis/test_hubble_launchers.py
      - .github/workflows/hubble-launcher-ci.yml

permissions:
  contents: read

# Keep the newest PR run; preserve independent push, release and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  launcher-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Exercise launcher process identity guards
        run: python3 hugegraph-hubble/hubble-dist/assembly/travis/test_hubble_launchers.py -v
