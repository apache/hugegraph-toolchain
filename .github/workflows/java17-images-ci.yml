name: java17-images-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .dockerignore
      - hugegraph-client/**
      - hugegraph-loader/**
      - hugegraph-hubble/**
      - hugegraph-dist/**
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/java17-images-ci.yml
      - pom.xml
  push:
    branches: [master, 'release-*']
    paths:
      - .dockerignore
      - hugegraph-client/**
      - hugegraph-loader/**
      - hugegraph-hubble/**
      - hugegraph-dist/**
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/java17-images-ci.yml
      - pom.xml

permissions:
  contents: read

concurrency:
  group: java17-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        module: [loader, hubble]
    env:
      IMAGE_MODULE: ${{ matrix.module }}
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check image gate fixtures
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test*.py'
          bash -n .github/scripts/build-java17-image.sh
      - name: Install locked same-source SDK
        id: server
        uses: ./.github/actions/setup-candidate-sdk
        with:
          repository: apache/hugegraph
          expected-commit: 68855199031d5801edb4fe41b2bacbacffe8fe68
      - name: Build same-source dependencies and the real image
        env:
          IMAGE_EVIDENCE: ${{ runner.temp }}/java17-image-${{ matrix.module }}-evidence
          SDK_REPOSITORY: ${{ steps.server.outputs.maven-repo }}
          SERVER_ARCHIVE: ${{ steps.server.outputs.archive }}
          SERVER_ARCHIVE_SHA: ${{ steps.server.outputs.archive-sha256 }}
          SERVER_COMMIT: ${{ steps.server.outputs.commit_id }}
        run: |
          bash .github/scripts/build-java17-image.sh \
            "$IMAGE_MODULE" "$SERVER_COMMIT" "$SDK_REPOSITORY" "$SERVER_ARCHIVE" "$SERVER_ARCHIVE_SHA" "$IMAGE_EVIDENCE"
      # No server is running during either Maven/Docker build above.
      - name: Verify container provenance and data behavior
        env:
          IMAGE_EVIDENCE: ${{ runner.temp }}/java17-image-${{ matrix.module }}-evidence
        run: python3 .github/scripts/java17_image.py smoke "$IMAGE_EVIDENCE"
      - name: Preserve non-sensitive gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java17-image-${{ matrix.module }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/java17-image-${{ matrix.module }}-evidence/*.json
            ${{ runner.temp }}/java17-image-${{ matrix.module }}-evidence/*.log
          if-no-files-found: warn
          retention-days: 14
