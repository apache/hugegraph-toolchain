name: Toolchain image startup

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: build-and-start
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and start this checkout's image
        env:
          MODULE: ${{ inputs.module }}
        run: python3 .github/scripts/check-toolchain-image.py "$MODULE"
