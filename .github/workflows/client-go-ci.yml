name: "go-client-ci"

on:
  workflow_call:
    inputs:
      server-repository:
        type: string
        default: apache/hugegraph
      artifact-name:
        type: string
        required: true
      server-commit:
        type: string
        required: true
      server-ref:
        type: string
        required: true

jobs:
  client-go-ci:
    runs-on: ubuntu-latest
    env:
      TRAVIS_DIR: hugegraph-client/assembly/travis
    strategy:
      fail-fast: false
      matrix:
        JAVA_VERSION: ['17']

    steps:
      - name: Fetch Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install released Server JVM
        id: server-java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
          overwrite-settings: false

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'zulu'

      - name: Setup HugeGraph server
        uses: ./.github/actions/setup-hugegraph-server
        with:
          travis-dir: ${{ env.TRAVIS_DIR }}
          commit-id: ${{ inputs.server-commit }}
          repository: ${{ inputs.server-repository }}
          fetch-ref: ${{ inputs.server-ref }}
          artifact-name: ${{ inputs.artifact-name }}
          mode: start
          java-version: '11'
          java-home: ${{ steps.server-java.outputs.path }}

      - name: Init Go env
        uses: actions/setup-go@v6
        with:
          go-version: '1.x'
          cache-dependency-path: hugegraph-client-go/go.sum

      - name: Go test
        run: |
          go version
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144
          cd hugegraph-client-go && make test
