name: Upstream compatibility

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/upstream-compatibility.yml'
      - '.github/actions/get-hugegraph-commit/**'
      - '.github/actions/setup-candidate-sdk/**'
      - '.github/actions/setup-java-env/**'
      - '.github/configs/settings.xml'
      - 'hugegraph-client/assembly/travis/install-candidate-sdk.sh'
      - 'hugegraph-client/assembly/travis/checkout-server.sh'
      - 'hugegraph-client/assembly/travis/start-hugegraph-servers.sh'
      - '.github/scripts/verify_candidate_image_sdk.py'

permissions:
  contents: read

concurrency:
  group: upstream-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upstream-master:
    if: github.event_name != 'schedule' || github.repository == 'apache/hugegraph-toolchain'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch code
        uses: actions/checkout@v7

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: '17'
          distribution: temurin

      - name: Resolve latest ASF master once
        id: upstream
        uses: ./.github/actions/get-hugegraph-commit
        with:
          repository: apache/hugegraph
          ref: master

      - name: Install SDK from the resolved commit
        id: sdk
        uses: ./.github/actions/setup-candidate-sdk
        with:
          repository: apache/hugegraph
          ref: ${{ steps.upstream.outputs.commit_id }}
          expected-commit: ${{ steps.upstream.outputs.commit_id }}
          validation-mode: release

      - name: Select verified SDK version for all consumer builds and tests
        env:
          CANDIDATE_REPO: ${{ steps.sdk.outputs.maven-repo }}
        run: >-
          python3 .github/scripts/verify_candidate_image_sdk.py "$CANDIDATE_REPO"
          --configure-upstream-env "$GITHUB_ENV"

      - name: Compile core consumers
        run: |
          mvn install -pl hugegraph-client,hugegraph-loader,hugegraph-tools,hugegraph-spark-connector -am -DskipTests -Dmaven.javadoc.skip=true -ntp
          mvn compile -pl hugegraph-hubble/hubble-be -Dmaven.javadoc.skip=true -ntp

      - name: Start the same-source Server fixture
        env:
          CANDIDATE_ARCHIVE: ${{ steps.sdk.outputs.archive }}
        run: bash hugegraph-client/assembly/travis/start-hugegraph-servers.sh "$CANDIDATE_ARCHIVE"

      - name: Client unit and HTTP compatibility tests
        working-directory: hugegraph-client
        run: |
          mvn test -Dtest=UnitTestSuite -ntp
          mvn test -Dtest=ApiTestSuite -ntp
          mvn test -Dtest=FuncTestSuite -ntp

      - name: Loader and Hubble backend unit tests
        run: |
          mvn test -P unit -pl hugegraph-loader -ntp
          mvn test -P unit-test -pl hugegraph-hubble/hubble-be -ntp

      - name: Tools functional compatibility tests
        run: mvn test -Dtest=FuncTestSuite -Dtools.test.disposable=true -pl hugegraph-tools -ntp

      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-compatibility-reports-${{ github.run_attempt }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 7
