name: "CodeQL"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, 'release-*']
  schedule:
    - cron: '42 20 * * 6'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt == 1 && 'head' || format('rerun-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      security: ${{ steps.select.outputs.security }}
      languages: ${{ steps.select.outputs.security_languages }}
      dependency-audit: ${{ steps.select.outputs.dependency_audit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select scan inputs without preparing fixtures
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/ci-policy.py plan --project toolchain
          --event-path "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"
          --output scan-plan.json

  analyze:
    needs: plan
    if: needs.plan.outputs.security == 'true'
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      # Preserve the master scan identity when invoked by a reusable-workflow caller.
      CODEQL_ACTION_ANALYSIS_KEY: .github/workflows/codeql-analysis.yml:analyze
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.languages) }}
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: use staged maven repo settings
      if: ${{ env.USE_STAGE == 'true' }}
      run: |
        cp "$HOME/.m2/settings.xml" /tmp/settings.xml
        mv -vf .github/configs/settings.xml "$HOME/.m2/settings.xml"

    - name: Use Node.js 16
      uses: actions/setup-node@v6
      with:
        node-version: '16'
    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality


    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    - if: matrix.language == 'python' || matrix.language == 'javascript'
      name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - if: matrix.language == 'java'
      name: Build Java
      run: |
        mvn clean package -f "pom.xml" -B -V -e -Dfindbugs.skip -Dcheckstyle.skip -Dpmd.skip=true -Dspotbugs.skip -Denforcer.skip -Dmaven.javadoc.skip -DskipTests -Dmaven.test.skip.exec -Dlicense.skip=true -Drat.skip=true -Dspotless.check.skip=true

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #   If the Autobuild fails above, remove it and uncomment the following three lines.
    #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.

    # - run: |
    #   echo "Run, Build Application using script"
    #   ./location_of_script_within_repo/buildscript.sh

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: .github/workflows/codeql-analysis.yml:analyze/language:${{ matrix.language }}

  dependency-review:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.dependency-audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5.0.0
