name: "loader-ci"

on:
  workflow_call:
    inputs:
      server-repository:
        type: string
        default: apache/hugegraph
      artifact-name:
        type: string
        required: true
      server-commit:
        type: string
        required: true
      server-ref:
        type: string
        required: true

jobs:
  loader-ci:
    runs-on: ubuntu-latest
    env:
      TRAVIS_DIR: hugegraph-loader/assembly/travis
      STATIC_DIR: hugegraph-loader/assembly/static
      DB_USER: root
      DB_PASS: root
      DB_DATABASE: load_test
    strategy:
      fail-fast: false
      matrix:
        JAVA_VERSION: ['17']
        SERVER_BASELINE: ['candidate', 'release-1.7']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Fetch Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install released Server JVM
        if: matrix.SERVER_BASELINE == 'release-1.7'
        id: released-java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          overwrite-settings: false

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Install locked candidate SDK
        id: candidate-sdk
        uses: ./.github/actions/setup-candidate-sdk

      - name: Cache Hadoop
        uses: actions/cache@v6
        with:
          path: ~/hadoop-3.3.6.tar.gz
          key: ${{ runner.os }}-hadoop-3.3.6

      - name: Compile
        run: |
          mvn install -pl hugegraph-client,hugegraph-loader -am -Dmaven.javadoc.skip=true -DskipTests -ntp

      - name: Prepare Hadoop service
        run: bash "$TRAVIS_DIR/install-hadoop.sh"

      - name: Setup released Server fixture
        if: matrix.SERVER_BASELINE == 'release-1.7'
        uses: ./.github/actions/setup-hugegraph-server
        with:
          travis-dir: ${{ env.TRAVIS_DIR }}
          commit-id: ${{ inputs.server-commit }}
          repository: ${{ inputs.server-repository }}
          fetch-ref: ${{ inputs.server-ref }}
          java-home: ${{ steps.released-java.outputs.path }}
          mode: start
          artifact-name: ${{ inputs.artifact-name }}
          java-version: '11'

      - name: Start candidate Server fixture
        if: matrix.SERVER_BASELINE == 'candidate'
        env:
          CANDIDATE_ARCHIVE: ${{ steps.candidate-sdk.outputs.archive }}
        run: bash hugegraph-client/assembly/travis/start-hugegraph-servers.sh "$CANDIDATE_ARCHIVE"

      - name: Run test
        run: |
          cd hugegraph-loader && ls
          mvn test -P unit -ntp
          mvn test -P file
          mvn test -P hdfs
          mvn test -P jdbc
          mvn test -P kafka

      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: hugegraph-loader/target/jacoco.xml
