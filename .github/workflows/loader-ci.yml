name: "loader-ci"

on:
  workflow_call:
    inputs:
      server-repository:
        type: string
        default: apache/hugegraph
      artifact-name:
        type: string
        required: true
      server-commit:
        type: string
        required: true
      server-ref:
        type: string
        required: true

jobs:
  profiles:
    name: profiles
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-loader/assembly/travis
      STATIC_DIR: hugegraph-loader/assembly/static
      DB_USER: root
      DB_PASS: root
      DB_DATABASE: load_test
    strategy:
      matrix:
        JAVA_VERSION: ['11']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Fetch Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'temurin'
          use-stage: ${{ env.USE_STAGE }}

      - name: Compile
        run: |
          mvn install -pl hugegraph-client,hugegraph-loader -am -Dmaven.javadoc.skip=true -DskipTests -ntp

      - name: Setup HugeGraph server
        uses: ./.github/actions/setup-hugegraph-server
        with:
          mode: start
          artifact-name: ${{ inputs.artifact-name }}
          commit-id: ${{ inputs.server-commit }}
          repository: ${{ inputs.server-repository }}
          fetch-ref: ${{ inputs.server-ref }}
          travis-dir: ${{ env.TRAVIS_DIR }}

      - name: Run test
        run: |
          cd hugegraph-loader && ls
          mvn test -P unit -ntp
          mvn test -P file
          mvn test -P jdbc
          mvn test -P kafka

      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: hugegraph-loader/target/jacoco.xml

  hdfs:
    name: hdfs
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-loader/assembly/travis
      STATIC_DIR: hugegraph-loader/assembly/static
      DB_USER: root
      DB_PASS: root
      DB_DATABASE: load_test
    strategy:
      matrix:
        JAVA_VERSION: ['11']
    steps:
      - name: Fetch Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'temurin'
          use-stage: ${{ env.USE_STAGE }}

      - name: Compile
        run: |
          mvn install -pl hugegraph-client,hugegraph-loader -am -Dmaven.javadoc.skip=true -DskipTests -ntp

      - name: Setup HugeGraph server
        uses: ./.github/actions/setup-hugegraph-server
        with:
          mode: start
          artifact-name: ${{ inputs.artifact-name }}
          commit-id: ${{ inputs.server-commit }}
          repository: ${{ inputs.server-repository }}
          fetch-ref: ${{ inputs.server-ref }}
          travis-dir: ${{ env.TRAVIS_DIR }}

      - name: Cache verified Hadoop archive
        uses: actions/cache@v6
        with:
          path: |
            ~/hadoop-3.3.6.tar.gz
            ~/hadoop-3.3.6.tar.gz.sha512
          key: ${{ runner.os }}-hadoop-3.3.6-sha512-v1
          # Legacy archives are accepted only after the installer's fixed SHA-512 check.
          restore-keys: ${{ runner.os }}-hadoop-3.3.6

      - name: Start Hadoop
        timeout-minutes: 35
        run: |
          "$TRAVIS_DIR/install-hadoop.sh"

      - name: Run HDFS tests
        run: mvn test -P hdfs -f hugegraph-loader/pom.xml -ntp

      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: hugegraph-loader/target/jacoco.xml
