name: "loader-ci"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - /^release-.*$/
    paths:
      - hugegraph-loader/**
      - hugegraph-dist/**
      - .github/workflows/**
      - pom.xml
  pull_request:
    paths:
      - hugegraph-loader/**
      - hugegraph-dist/**
      - hugegraph-client/**
      - .github/workflows/**
      - pom.xml

jobs:
  loader-ci:
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-loader/assembly/travis
      STATIC_DIR: hugegraph-loader/assembly/static
      DB_USER: root
      DB_PASS: root
      DB_DATABASE: load_test
      HADOOP_VERSION: 3.3.6
    strategy:
      matrix:
        JAVA_VERSION: ['11']
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Fetch Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest 15 commit id from master
        id: get-commit-id
        run: |
          git fetch origin master
          COMMIT_ID=$(git log --format="%h" origin/master -n 15 | head -n 1)
          echo "commit_id=$COMMIT_ID" >> $GITHUB_OUTPUT

      - name: Install JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'adopt'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache Hadoop
        uses: actions/cache@v4
        with:
          path: ~/hadoop-3.3.6.tar.gz
          key: ${{ runner.os }}-hadoop-3.3.6

      - name: Cache HugeGraph Server
        uses: actions/cache@v4
        with:
          path: ~/hugegraph-cache-${{ steps.get-commit-id.outputs.commit_id }}
          key: ${{ runner.os }}-hugegraph-server-${{ steps.get-commit-id.outputs.commit_id }}

      - name: use staged maven repo settings
        if: ${{ env.USE_STAGE == 'true' }}
        run: |
          cp $HOME/.m2/settings.xml /tmp/settings.xml
          mv -vf .github/configs/settings.xml $HOME/.m2/settings.xml

      - name: Compile
        run: |
          mvn install -pl hugegraph-client,hugegraph-loader -am -Dmaven.javadoc.skip=true -DskipTests -ntp

      - name: Prepare env and service
        run: |
          $TRAVIS_DIR/install-hadoop.sh
          $TRAVIS_DIR/install-hugegraph-from-source.sh ${{ steps.get-commit-id.outputs.commit_id }}

      - name: Run test
        run: |
          cd hugegraph-loader && ls
          mvn test -P unit -ntp
          mvn test -P file
          mvn test -P hdfs
          mvn test -P jdbc
          mvn test -P kafka

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: target/jacoco.xml
