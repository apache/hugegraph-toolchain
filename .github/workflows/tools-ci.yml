name: "tools-ci"

on:
  workflow_call:
    inputs:
      server-repository:
        type: string
        default: apache/hugegraph
      artifact-name:
        type: string
        required: true
      server-commit:
        type: string
        required: true
      server-ref:
        type: string
        required: true

jobs:
  tools-ci:
    runs-on: ubuntu-latest
    env:
      USE_STAGE: 'true' # Whether to include the stage repository.
      TRAVIS_DIR: hugegraph-tools/assembly/travis
    strategy:
      matrix:
        JAVA_VERSION: ['11', '17']

    steps:
      - name: Fetch Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install released Server JVM
        id: server-java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
          overwrite-settings: false

      - name: Setup Java environment
        uses: ./.github/actions/setup-java-env
        with:
          java-version: ${{ matrix.JAVA_VERSION }}
          distribution: 'temurin'
          use-stage: ${{ env.USE_STAGE }}

      - name: Compile
        run: |
          mvn install -pl hugegraph-client,hugegraph-tools -am -Dmaven.javadoc.skip=true -DskipTests -ntp

      - name: Setup HugeGraph server
        uses: ./.github/actions/setup-hugegraph-server
        with:
          travis-dir: ${{ env.TRAVIS_DIR }}
          commit-id: ${{ inputs.server-commit }}
          repository: ${{ inputs.server-repository }}
          fetch-ref: ${{ inputs.server-ref }}
          artifact-name: ${{ inputs.artifact-name }}
          mode: start
          java-version: '11'
          java-home: ${{ steps.server-java.outputs.path }}

      - name: Run test
        run: |
          # The setup step above creates this job's disposable server instance.
          mvn test -Dtest=FuncTestSuite -Dtools.test.disposable=true -pl hugegraph-tools -ntp
